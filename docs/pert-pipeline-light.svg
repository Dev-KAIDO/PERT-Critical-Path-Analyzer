<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 300" role="img" aria-labelledby="title desc"><title id="title">PERT Analyzer workflow</title><desc id="desc">A clean five-stage workflow from image intake to validated export.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e6eef5"/></pattern><linearGradient id="line" x1="0" x2="1"><stop stop-color="#0e7490"/><stop offset=".55" stop-color="#2563eb"/><stop offset="1" stop-color="#16a34a"/></linearGradient></defs><rect width="1400" height="300" rx="22" fill="#f8fbff"/><rect width="1400" height="300" rx="22" fill="url(#grid)"/><text x="48" y="48" fill="#102a43" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">The evidence-first workflow</text><text x="48" y="74" fill="#627d98" font-family="Arial,Helvetica,sans-serif" font-size="14">Automation moves the work forward; validation decides whether the result is trusted.</text><path d="M116 169H1280" stroke="#c6d8e5" stroke-width="5" stroke-linecap="round"/><path d="M116 169H1280" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><g><circle cx="116" cy="169" r="31" fill="#e0f2fe" stroke="#0e7490" stroke-width="3"/><text x="116" y="175" fill="#075985" font-size="16" font-weight="700">01</text><rect x="42" y="214" width="148" height="54" rx="12" fill="#ffffff" stroke="#b9cfe0"/><text x="116" y="236" fill="#102a43" font-size="14" font-weight="700">INGEST</text><text x="116" y="254" fill="#627d98" font-size="11">image input</text></g><g><circle cx="386" cy="169" r="31" fill="#e0e7ff" stroke="#2563eb" stroke-width="3"/><text x="386" y="175" fill="#1d4ed8" font-size="16" font-weight="700">02</text><rect x="312" y="214" width="148" height="54" rx="12" fill="#ffffff" stroke="#b9cfe0"/><text x="386" y="236" fill="#102a43" font-size="14" font-weight="700">DETECT</text><text x="386" y="254" fill="#627d98" font-size="11">shapes + OCR</text></g><g><circle cx="656" cy="169" r="31" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="656" y="175" fill="#b45309" font-size="16" font-weight="700">03</text><rect x="582" y="214" width="148" height="54" rx="12" fill="#ffffff" stroke="#b9cfe0"/><text x="656" y="236" fill="#102a43" font-size="14" font-weight="700">REBUILD</text><text x="656" y="254" fill="#627d98" font-size="11">graph + relations</text></g><g><circle cx="926" cy="169" r="31" fill="#fce7f3" stroke="#be185d" stroke-width="3"/><text x="926" y="175" fill="#9d174d" font-size="16" font-weight="700">04</text><rect x="852" y="214" width="148" height="54" rx="12" fill="#ffffff" stroke="#b9cfe0"/><text x="926" y="236" fill="#102a43" font-size="14" font-weight="700">REVIEW</text><text x="926" y="254" fill="#627d98" font-size="11">confidence gate</text></g><g><circle cx="1196" cy="169" r="31" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1196" y="175" fill="#15803d" font-size="16" font-weight="700">05</text><rect x="1122" y="214" width="148" height="54" rx="12" fill="#ffffff" stroke="#b9cfe0"/><text x="1196" y="236" fill="#102a43" font-size="14" font-weight="700">CALCULATE</text><text x="1196" y="254" fill="#627d98" font-size="11">CPM / PERT export</text></g></g></svg>
