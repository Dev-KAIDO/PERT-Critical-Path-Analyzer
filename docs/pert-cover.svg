<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc"><title id="title">PERT Critical Path Analyzer</title><desc id="desc">A clean blueprint-style cover showing a project network diagram becoming a validated critical path.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#dbe7f1" stroke-width="1"/></pattern><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf6f7"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f2942" flood-opacity=".12"/></filter></defs><rect width="1400" height="360" rx="24" fill="url(#wash)"/><rect width="1400" height="360" rx="24" fill="url(#grid)"/><rect x="48" y="48" width="570" height="264" rx="20" fill="#ffffff" stroke="#b9cfe0" stroke-width="2" filter="url(#shadow)"/><rect x="48" y="48" width="10" height="264" rx="5" fill="#0e7490"/><text x="92" y="105" fill="#102a43" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700">PERT Analyzer</text><text x="94" y="139" fill="#0e7490" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="2">READ · REVIEW · CALCULATE</text><text x="94" y="188" fill="#486581" font-family="Arial,Helvetica,sans-serif" font-size="17">Turn network-diagram images into</text><text x="94" y="214" fill="#486581" font-family="Arial,Helvetica,sans-serif" font-size="17">validated project insight.</text><g font-family="Arial,Helvetica,sans-serif"><rect x="94" y="248" width="120" height="32" rx="16" fill="#e0f2fe"/><text x="154" y="269" fill="#075985" text-anchor="middle" font-size="12" font-weight="700">VISION + OCR</text><rect x="226" y="248" width="126" height="32" rx="16" fill="#fef3c7"/><text x="289" y="269" fill="#92400e" text-anchor="middle" font-size="12" font-weight="700">REVIEW GATE</text><rect x="364" y="248" width="112" height="32" rx="16" fill="#dcfce7"/><text x="420" y="269" fill="#166534" text-anchor="middle" font-size="12" font-weight="700">CPM / PERT</text></g><g stroke="#55758d" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M720 126H850l55 78h135"/><path d="M720 266H850l55-62h135"/><path d="M905 204h135"/></g><g stroke="#0e7490" stroke-width="5" fill="#ffffff"><rect x="666" y="95" width="108" height="62" rx="14"/><rect x="666" y="235" width="108" height="62" rx="14"/><rect x="855" y="173" width="112" height="62" rx="14"/><rect x="1035" y="173" width="142" height="62" rx="14"/></g><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><text x="720" y="132" fill="#102a43" font-size="15" font-weight="700">IMAGE</text><text x="720" y="272" fill="#102a43" font-size="15" font-weight="700">EVIDENCE</text><text x="911" y="210" fill="#0e7490" font-size="14" font-weight="700">GRAPH + REVIEW</text><text x="1106" y="210" fill="#166534" font-size="15" font-weight="700">CRITICAL PATH</text></g><circle cx="1260" cy="205" r="38" fill="#0e7490"/><path d="M1243 205l12 12 24-29" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
