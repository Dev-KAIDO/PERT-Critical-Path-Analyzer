<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" role="img" aria-labelledby="title desc"><title id="title">PERT Analyzer feature icons</title><desc id="desc">Four compact feature icons for vision, evidence, review, and critical path analysis.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e6eef5"/></pattern></defs><rect width="1000" height="170" rx="22" fill="#f8fbff"/><rect width="1000" height="170" rx="22" fill="url(#grid)"/><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><g><circle cx="125" cy="68" r="35" fill="#e0f2fe" stroke="#0e7490" stroke-width="3"/><rect x="105" y="50" width="40" height="30" rx="5" fill="#fff" stroke="#075985" stroke-width="3"/><circle cx="125" cy="65" r="8" fill="none" stroke="#0e7490" stroke-width="3"/><text x="125" y="128" fill="#102a43" font-size="14" font-weight="700">VISION</text><text x="125" y="147" fill="#627d98" font-size="11">read the diagram</text></g><g><circle cx="375" cy="68" r="35" fill="#e0e7ff" stroke="#2563eb" stroke-width="3"/><path d="M355 66l13 13 27-31" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="375" y="128" fill="#102a43" font-size="14" font-weight="700">EVIDENCE</text><text x="375" y="147" fill="#627d98" font-size="11">confidence-aware</text></g><g><circle cx="625" cy="68" r="35" fill="#fff7ed" stroke="#d97706" stroke-width="3"/><path d="M625 46l20 12v22l-20 12-20-12V58z" fill="#fff" stroke="#d97706" stroke-width="3"/><path d="M625 58v22M605 58l20 12 20-12" fill="none" stroke="#d97706" stroke-width="3"/><text x="625" y="128" fill="#102a43" font-size="14" font-weight="700">REVIEW</text><text x="625" y="147" fill="#627d98" font-size="11">correct uncertainty</text></g><g><circle cx="875" cy="68" r="35" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><path d="M850 84l16-29 12 17 13-8" fill="none" stroke="#166534" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="875" y="128" fill="#102a43" font-size="14" font-weight="700">CRITICAL PATH</text><text x="875" y="147" fill="#627d98" font-size="11">calculate with confidence</text></g></g></svg>
