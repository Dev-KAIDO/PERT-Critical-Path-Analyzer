<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc"><title id="title">PERT Analyzer evidence review gate</title><desc id="desc">A refined light blueprint illustration showing one validated path and one human review path.</desc><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dbe7f1" stroke-width="1"/></pattern><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eef8f7"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#102a43" flood-opacity=".12"/></filter></defs><rect width="1400" height="360" rx="24" fill="url(#wash)"/><rect width="1400" height="360" rx="24" fill="url(#grid)"/><rect x="52" y="52" width="420" height="256" rx="20" fill="#ffffff" stroke="#b9cfe0" stroke-width="2" filter="url(#shadow)"/><rect x="52" y="52" width="9" height="256" rx="4" fill="#0e7490"/><text x="94" y="108" fill="#102a43" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700">Evidence gate</text><text x="94" y="140" fill="#0e7490" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">CONFIDENCE BEFORE CALCULATION</text><text x="94" y="190" fill="#486581" font-family="Arial,Helvetica,sans-serif" font-size="16">The graph moves forward only</text><text x="94" y="216" fill="#486581" font-family="Arial,Helvetica,sans-serif" font-size="16">when its evidence is understood.</text><rect x="94" y="250" width="188" height="32" rx="16" fill="#e0f2fe"/><text x="188" y="271" fill="#075985" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle">NO SILENT ASSUMPTIONS</text><g stroke="#8aa7ba" stroke-width="4" fill="none" stroke-linecap="round"><path d="M555 180H660"/><path d="M800 180H930"/><path d="M800 180C860 180 858 102 930 102"/><path d="M800 180C860 180 858 258 930 258"/></g><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><rect x="515" y="139" width="150" height="82" rx="16" fill="#e0f2fe" stroke="#0e7490" stroke-width="2"/><text x="590" y="173" fill="#075985" font-size="15" font-weight="700">DETECTED</text><text x="590" y="195" fill="#486581" font-size="12">graph + evidence</text><rect x="665" y="132" width="145" height="96" rx="48" fill="#fff7ed" stroke="#d97706" stroke-width="3"/><text x="737" y="173" fill="#92400e" font-size="16" font-weight="700">VALID?</text><text x="737" y="196" fill="#b45309" font-size="11">confidence · topology</text><rect x="930" y="58" width="235" height="88" rx="18" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><circle cx="976" cy="102" r="21" fill="#dcfce7"/><path d="M966 102l8 8 15-18" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="1070" y="97" fill="#166534" font-size="15" font-weight="700">CONTINUE</text><text x="1070" y="119" fill="#486581" font-size="12">CPM / PERT analysis</text><rect x="930" y="214" width="235" height="88" rx="18" fill="#ffffff" stroke="#be185d" stroke-width="2"/><circle cx="976" cy="258" r="21" fill="#fce7f3"/><path d="M976 248v13M976 270v2" stroke="#be185d" stroke-width="5" stroke-linecap="round"/><text x="1070" y="253" fill="#9d174d" font-size="15" font-weight="700">REVIEW FIRST</text><text x="1070" y="275" fill="#486581" font-size="12">correct · accept · validate</text><text x="737" y="337" fill="#627d98" font-family="Arial,Helvetica,sans-serif" font-size="13">One decision. Two safe outcomes. No hidden uncertainty.</text></g></svg>
