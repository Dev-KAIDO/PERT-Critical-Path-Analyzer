<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc"><title id="title">PERT Analyzer review gate</title><desc id="desc">A simple decision gate showing that sufficient evidence proceeds to analysis while uncertainty goes to human review.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e6eef5"/></pattern></defs><rect width="1200" height="250" rx="20" fill="#f8fbff"/><rect width="1200" height="250" rx="20" fill="url(#grid)"/><text x="48" y="48" fill="#102a43" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">Review gate: confidence before calculation</text><text x="48" y="74" fill="#627d98" font-family="Arial,Helvetica,sans-serif" font-size="14">The system never hides uncertainty inside a polished-looking schedule.</text><g stroke="#9fb3c8" stroke-width="4" fill="none" stroke-linecap="round"><path d="M230 143H470"/><path d="M590 143H805"/><path d="M590 143l-55-55"/><path d="M590 143l-55 55"/><path d="M805 143h170"/></g><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><rect x="70" y="106" width="160" height="74" rx="14" fill="#e0f2fe" stroke="#0e7490" stroke-width="2"/><text x="150" y="136" fill="#075985" font-size="15" font-weight="700">DETECTED GRAPH</text><text x="150" y="158" fill="#486581" font-size="12">evidence collected</text><polygon points="530,86 590,26 650,86 590,146" fill="#fff7ed" stroke="#d97706" stroke-width="3"/><text x="590" y="84" fill="#92400e" font-size="14" font-weight="700">VALID?</text><text x="590" y="104" fill="#b45309" font-size="11">confidence + topology</text><rect x="805" y="106" width="170" height="74" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="890" y="136" fill="#166534" font-size="15" font-weight="700">CPM / PERT</text><text x="890" y="158" fill="#486581" font-size="12">authoritative result</text><rect x="355" y="32" width="180" height="38" rx="19" fill="#fce7f3" stroke="#be185d"/><text x="445" y="56" fill="#9d174d" font-size="13" font-weight="700">NO → HUMAN REVIEW</text><rect x="355" y="180" width="180" height="38" rx="19" fill="#dcfce7" stroke="#16a34a"/><text x="445" y="204" fill="#166534" font-size="13" font-weight="700">YES → CONTINUE</text><rect x="1000" y="106" width="150" height="74" rx="14" fill="#ffffff" stroke="#b9cfe0"/><text x="1075" y="136" fill="#102a43" font-size="15" font-weight="700">EXPORT</text><text x="1075" y="158" fill="#486581" font-size="12">JSON · CSV · PDF</text></g></svg>
