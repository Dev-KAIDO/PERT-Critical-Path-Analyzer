<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc"><title id="title">PERT Analyzer automated pipeline</title><desc id="desc">A visual pipeline from diagram image through computer vision, OCR, graph reconstruction, review gate, CPM and PERT analysis, and report export.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1120"/><stop offset=".55" stop-color="#172554"/><stop offset="1" stop-color="#064e3b"/></linearGradient><linearGradient id="flow" x1="0" x2="1"><stop stop-color="#67e8f9"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#86efac"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1500" height="470" rx="30" fill="url(#bg)"/><g opacity=".07" stroke="#fff"><path d="M0 94h1500M0 188h1500M0 282h1500M0 376h1500M100 0v470M250 0v470M400 0v470M550 0v470M700 0v470M850 0v470M1000 0v470M1150 0v470M1300 0v470M1450 0v470"/></g><text x="56" y="54" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">From diagram image to defensible project insight</text><text x="56" y="84" fill="#c4b5fd" font-family="Arial,Helvetica,sans-serif" font-size="15">Automation accelerates the analysis — the review gate protects the mathematics.</text><path d="M126 247H1370" stroke="#020617" stroke-width="18" stroke-linecap="round" opacity=".6"/><path d="M126 247H1370" stroke="url(#flow)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><g><rect x="45" y="150" width="160" height="190" rx="17" fill="#164e63" stroke="#67e8f9" stroke-width="2"/><circle cx="92" cy="194" r="22" fill="#082f49" stroke="#67e8f9" stroke-width="3"/><text x="92" y="201" fill="#cffafe" font-size="16" font-weight="700">01</text><text x="137" y="197" fill="#ecfeff" font-size="15" font-weight="700">INGEST</text><text x="125" y="245" fill="#bae6fd" font-size="13">PNG / JPEG</text><text x="125" y="270" fill="#bae6fd" font-size="12">AON or AOA</text><text x="125" y="313" fill="#67e8f9" font-size="11">input image</text></g><g><rect x="235" y="150" width="170" height="190" rx="17" fill="#1e3a8a" stroke="#93c5fd" stroke-width="2"/><circle cx="282" cy="194" r="22" fill="#172554" stroke="#93c5fd" stroke-width="3"/><text x="282" y="201" fill="#dbeafe" font-size="16" font-weight="700">02</text><text x="328" y="197" fill="#eff6ff" font-size="15" font-weight="700">VISION</text><text x="320" y="245" fill="#bfdbfe" font-size="13">shapes · arrows</text><text x="320" y="270" fill="#bfdbfe" font-size="12">preprocess · geometry</text><text x="320" y="313" fill="#93c5fd" font-size="11">OpenCV</text></g><g><rect x="435" y="150" width="170" height="190" rx="17" fill="#312e81" stroke="#c4b5fd" stroke-width="2"/><circle cx="482" cy="194" r="22" fill="#1e1b4b" stroke="#c4b5fd" stroke-width="3"/><text x="482" y="201" fill="#ede9fe" font-size="16" font-weight="700">03</text><text x="528" y="197" fill="#f5f3ff" font-size="15" font-weight="700">OCR</text><text x="520" y="245" fill="#ddd6fe" font-size="13">labels · durations</text><text x="520" y="270" fill="#ddd6fe" font-size="12">confidence · language</text><text x="520" y="313" fill="#c4b5fd" font-size="11">Tesseract</text></g><g><rect x="635" y="150" width="190" height="190" rx="17" fill="#713f12" stroke="#fcd34d" stroke-width="2"/><circle cx="682" cy="194" r="22" fill="#451a03" stroke="#fcd34d" stroke-width="3"/><text x="682" y="201" fill="#fef3c7" font-size="16" font-weight="700">04</text><text x="730" y="197" fill="#fffbeb" font-size="15" font-weight="700">RECONSTRUCT</text><text x="730" y="245" fill="#fde68a" font-size="13">graph · dependencies</text><text x="730" y="270" fill="#fde68a" font-size="12">AON / AOA model</text><text x="730" y="313" fill="#fcd34d" font-size="11">NetworkX</text></g><g><rect x="855" y="118" width="220" height="254" rx="17" fill="#9d174d" stroke="#f9a8d4" stroke-width="3"/><circle cx="905" cy="163" r="22" fill="#500724" stroke="#f9a8d4" stroke-width="3"/><text x="905" y="170" fill="#fce7f3" font-size="16" font-weight="700">05</text><text x="965" y="166" fill="#fdf2f8" font-size="15" font-weight="700">REVIEW GATE</text><text x="965" y="214" fill="#fbcfe8" font-size="13">confidence + issues</text><text x="965" y="240" fill="#fbcfe8" font-size="12">human correction</text><text x="965" y="266" fill="#fbcfe8" font-size="12">required when uncertain</text><path d="M893 300h145" stroke="#f9a8d4" stroke-width="2"/><text x="965" y="328" fill="#f9a8d4" font-size="11">no silent CPM from bad graphs</text></g><g><rect x="1125" y="150" width="160" height="190" rx="17" fill="#166534" stroke="#86efac" stroke-width="2"/><circle cx="1172" cy="194" r="22" fill="#14532d" stroke="#86efac" stroke-width="3"/><text x="1172" y="201" fill="#dcfce7" font-size="16" font-weight="700">06</text><text x="1222" y="197" fill="#f0fdf4" font-size="15" font-weight="700">ANALYZE</text><text x="1205" y="245" fill="#bbf7d0" font-size="13">CPM · PERT</text><text x="1205" y="270" fill="#bbf7d0" font-size="12">float · paths</text><text x="1205" y="313" fill="#86efac" font-size="11">validated graph</text></g><g><rect x="1305" y="150" width="150" height="190" rx="17" fill="#14532d" stroke="#86efac" stroke-width="2"/><circle cx="1350" cy="194" r="22" fill="#052e16" stroke="#86efac" stroke-width="3"/><text x="1350" y="201" fill="#dcfce7" font-size="16" font-weight="700">07</text><text x="1400" y="197" fill="#f0fdf4" font-size="15" font-weight="700">EXPORT</text><text x="1380" y="245" fill="#bbf7d0" font-size="13">JSON · CSV</text><text x="1380" y="270" fill="#bbf7d0" font-size="12">Excel · PDF</text><text x="1380" y="313" fill="#86efac" font-size="11">audit-ready</text></g></g></svg>
